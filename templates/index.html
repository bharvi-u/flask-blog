<!DOCTYPE html>
<html>
<head>
    <title>Home - My Blog</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>My Blog</h1>
            <nav>
                <a href="/">Home</a>
                <a href="/about">About</a>
                <a href="/post/create">New Post</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2>Recent Posts</h2>
        
        {% if posts %}
            {% for post in posts %}
                <div class="post">
                    <h3 class="post-title">{{ post.title }}</h3>
                    <div class="post-meta">{{ post.created_at.strftime('%Y-%m-%d') }}</div>
                    <p>{{ post.content[:150] }}...</p>
                    <a href="/post/{{ post.id }}" class="btn">Read More</a>
                </div>
            {% endfor %}
        {% else %}
            <p>No posts yet. <a href="/post/create">Create one</a>.</p>
        {% endif %}
    </main>

    <footer>
        <div class="container">
            <p>My Blog &copy; 2026</p>
        </div>
    </footer>
</body>
</html>
